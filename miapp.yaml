apiVersion: apps/v1
kind: Deployment
metadata:
   name: app-legacy
spec:
   replicas: 1
   selector:
      matchLabels:
         app: legacy
   template:
      metadata:
         labels:
            app: legacy
      spec:
         containers:
         -  name: web
            image: miapp-legacy:1.0
            imagePullPolicy: IfNotPresent
            ports:
            -  containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
   name: app-legacy
spec:
   selector:
      app: legacy
   ports:
   -  port: 80
      targetPort: 80
---
apiVersion: v1
kind: Service
metadata:
   name: app-legacy
spec:
   selector:
      app: legacy
   ports:
   -  port: 80
      targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
   name: app-nuevo
spec:
   replicas: 1
   selector:
      matchLabels:
         app: nuevo
   template: 
      metadata:
         labels:
            app: nuevo
      spec:
         containers:
         -  name: web
            image: miapp-nuevo:1.0
            imagePullPolicy: IfNotPresent
            ports:
            -  containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
   name: app-nuevo
spec:
   selector:
      app: nuevo
   ports:
   -  port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
   name: miapp
spec:
   ingressClassName: traefik
   rules:
   -  host: miapp.example.com
      http:
         paths:
         -  path: /nuevo
            pathType: Prefix
            backend:
               service:
                  name: app-nuevo
                  port:
                     number: 80
         - path: /
           pathType: Prefix
           backend:
              service:
                 name: app-legacy
                 port:
                     number: 80

